# UNSUPPORTED on an 8GB card. bitsandbytes refuses to offload a 4-bit 7B model onto CPU.
# This is not the recommended workflow. Use configs/qwen25_3b_post_sft.yaml.
# The Hub LICENSE file for Qwen2.5-7B-Instruct is Apache-2.0. Qwen2.5-3B-Instruct is not.
base_model: Qwen/Qwen2.5-7B-Instruct
base_model_revision: a09a35458c702b33eeacc393d103063234e8bc28
chat_template: configs/qwen25_chat_template.jinja
assistant_only_loss: true
seed: 42
epochs: 1
batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
max_length: 512
warmup_steps: 20
save_steps: 500
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
fp16: true
fresh_start: true
gradient_checkpointing: true
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: bfloat16
local_repeats: 80
extra_data:
  - datasets/community/general.json
  - datasets/community/safety_refusals.json
hf_dataset: HuggingFaceH4/ultrachat_200k
hf_split: train_sft
hf_max_samples: 8000
hf_license: mit
hf_revision: 8049631c405ae6576f93f445c6b8166f76f5505a
