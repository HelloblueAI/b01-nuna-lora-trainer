# Measured: Qwen2.5-7B 4-bit does not fit an 8GB RTX 4060 (bitsandbytes refused a CPU offload). This is the same mix on the 3B base that does fit.
# Preference stage after configs/qwen25_3b_post_sft.yaml. MIT UltraFeedback.
# The SFT adapter is passed on the command line. This file is the data and the step size.
base_model: Qwen/Qwen2.5-3B-Instruct
chat_template: configs/qwen25_chat_template.jinja
seed: 42
epochs: 1
batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
beta: 0.1
max_length: 512
max_prompt_length: 256
warmup_steps: 10
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: bfloat16
hf_dataset: HuggingFaceH4/ultrafeedback_binarized
hf_split: train_prefs
hf_max_samples: 4000
hf_license: mit
