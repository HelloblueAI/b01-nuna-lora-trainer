base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
# Stock TinyLlama has no {% generation %} markers, so assistant_only_loss would supervise
# nothing. This template is the stock one plus those markers; rendering is byte-identical.
chat_template: configs/tinyllama_chat_template.jinja
assistant_only_loss: true
seed: 42

# Measured, not guessed: 5 epochs at rank 8 over attention only is 20 optimizer
# steps on a 30-example corpus, which left identity unlearned and the jailbreak
# probe answering "I'm ChatGPT" (2/6 required probes). See docs/EVIDENCE.md.
epochs: 30
batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
max_length: 512
warmup_steps: 10
save_steps: 200

# Rank 16 over attention *and* MLP. Persona is carried by the MLP projections;
# attention-only rank 8 had too little capacity to hold it.
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
fp16: true
fresh_start: true
