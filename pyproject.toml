[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b01-nuna-lora-trainer"
version = "0.1.0"
description = "Single-GPU PEFT LoRA SFT for TinyLlama (chat templates, eval gate)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Helloblue Inc" }]
keywords = ["lora", "peft", "trl", "tinylama", "sft"]
dependencies = [
  "transformers>=4.45.0,<5",
  "datasets>=3.0.0,<4",
  "accelerate>=1.0.0,<2",
  "peft>=0.13.0,<0.16",
  "trl>=0.14.0,<0.22",
  "safetensors>=0.4.5,<0.6",
  "huggingface_hub>=0.26.0,<1",
  "pyyaml>=6.0.1,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/HelloblueAI/b01-nuna-lora-trainer"
Issues = "https://github.com/HelloblueAI/b01-nuna-lora-trainer/issues"
Documentation = "https://github.com/HelloblueAI/b01-nuna-lora-trainer/blob/main/README.md"

[project.scripts]
b01-nuna-train = "b01_nuna_lora.train:main"
b01-nuna-eval = "b01_nuna_lora.eval:main"
b01-nuna-upload = "b01_nuna_lora.upload:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_train.py" = ["E402"]
