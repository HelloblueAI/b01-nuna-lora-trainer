---
name: Bug
description: Trainer, eval, or docs bug
labels: [bug]
body:
  - type: dropdown
    id: gpu
    attributes:
      label: GPU
      description: UW Bothell has confirmed shared NVIDIA GPUs with at least 8 GB VRAM for the student projects. Student access and training scheduling will be coordinated with UW faculty. Mark Required only when the bug cannot be shown with --dry-run or --check-only.
      options:
        - Not required
        - Required — schedule access with UW faculty
    validations:
      required: true
  - type: dropdown
    id: data-license
    attributes:
      label: Data licensing
      options:
        - No new data or base model
        - New data or a base model — license must be named
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Do not paste production credentials, provider API keys, or user chats.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Command line, OS, GPU, adapter commit if any.
    validations:
      required: true
