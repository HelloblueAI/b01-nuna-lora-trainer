name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo: lint, test, and CPU-only dry runs. Declared here rather than
# relying on the repository default so the token stays read-only if that default changes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU, no CUDA torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Dry-run train + eval schema
        run: |
          python -m b01_nuna_lora.train --dry-run --output outputs/ci-dry
          python -m b01_nuna_lora.train --dry-run --config configs/qlora.yaml --output outputs/ci-qlora
          python -m b01_nuna_lora.eval --check-only --report outputs/ci-eval.json
      - name: Train/eval contamination
        # Reports overlap rather than failing: 3 required probes are known to be
        # recall today (docs/EVIDENCE.md). This keeps the number visible in CI so
        # a new probe that copies a training row is noticed in review.
        run: python -m b01_nuna_lora.contamination --report outputs/ci-contamination.json
