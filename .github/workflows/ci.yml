name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU, no CUDA torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Dry-run train + eval schema
        run: |
          python -m b01_nuna_lora.train --dry-run --output outputs/ci-dry
          python -m b01_nuna_lora.eval --check-only --report outputs/ci-eval.json
